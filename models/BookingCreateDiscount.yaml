title: BookingCreateDiscount
description: A discount to apply to a booking at creation time.
type: object
properties:
  code:
    type: string
    description: The discount code used by the customer
    example: JMA99281
  amount:
    type: number
    description: The dollar amount of the discount that applies to the booking
    example: 4.5
  percentage:
    type: number
    description: "The discount percentage that applies to the booking as a whole, eg. 10 for 10% off"
    example: 10
  productIds:
    type: array
    description: "Restrict a custom discount to specific products. A booking item is eligible when its own product ID, or its parent product ID, appears in this list.\r\n\r\n- Applies to custom discounts only, i.e. those supplying `amount` or `percentage` without a `code`.\r\n- When omitted or empty the discount applies across all booking items.\r\n- This requires ROLLER first enables a meta setting for your platform to use."
    items:
      type: integer
      example: 12345679
